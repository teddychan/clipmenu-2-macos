name: Release

# Thin caller: delegates to the shared macOS release pipeline
# (teddychan/dragon-release-ci). Build (SwiftPM + assemble .app with Sparkle),
# Developer ID-sign, notarize, staple, publish the FREE ClipMenu, push the
# EdDSA-signed Sparkle appcast to docs/clipmenu-2/, and bump the Homebrew cask.
# Triggered by a v* tag on this repo. The Mac App Store build is separate —
# clipmenu-2 builds it in its own release-mas.yml, which is dispatched manually and
# consumes THIS tag rather than owning a version series of its own.
#
# Secrets are inherited from this repo's Actions secrets:
#   DEVELOPER_ID_CERT_P12_BASE64, DEVELOPER_ID_CERT_PASSWORD,
#   NOTARY_KEY_P8_BASE64, NOTARY_KEY_ID, NOTARY_ISSUER_ID,
#   PUBLIC_RELEASE_TOKEN, SPARKLE_EDDSA_PRIVATE_KEY
on:
  push:
    tags:
      - 'v*'
  # A verification-only dispatch, the shape dragon-sample-app has had since v6: run the tag gate
  # and the whole build, publish nothing. It is the only way to exercise this pipeline from a
  # branch with no tag — which is what a change to the BUILD, rather than to the app, needs. The
  # §R16 move of Info.plist and AppIcon.icns into App/ was exactly such a change, and without this
  # the only way to test it was to cut a public release.
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Run the gate and build, publish nothing'
        type: boolean
        default: true
      release_tag:
        description: 'Optional: an EXISTING exact vX.Y.Z tag to build. The job checks out that commit rather than the branch head. Leave empty to build this branch.'
        type: string
        default: ''

# The reusable release workflow creates the GitHub Release and uploads assets,
# which needs contents: write. This repo's default workflow token is read-only,
# so grant write here or the reusable call is rejected at startup.
permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: teddychan/dragon-release-ci/.github/workflows/release-macos.yml@v6
    secrets: inherit
    with:
      # `inputs` only exists for workflow_dispatch. On a TAG PUSH it is absent, so a bare
      # `${{ inputs.verify_only }}` evaluates to '' and GitHub rejects the whole run with
      # "evaluate reusable workflow inputs … Unexpected value ''" — 0 jobs, no log, and a public
      # tag spent for nothing. dragon-sample-app burned v1.4.1 on exactly that. Guard on the event
      # so a push resolves to a literal false.
      verify_only: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only || false }}
      release_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
      # v6's tag gate replaces v5's `VERSION=${TAG##*v}`, which left a value containing no "v"
      # untouched — so a workflow_dispatch arrived with a BRANCH ref and produced VERSION=main.
      # It also accepts only exact `vX.Y.Z`, and requires whats_new_path: the two move together,
      # because passing whats_new_path to v5 fails at startup (v5 does not define the input) and
      # omitting it on v6 fails the gate.
      #
      # ClipMenu's What's New entries are `L("An English sentence.")` — the key IS the text the
      # release notes show, so new notes cannot exist without this file moving, and the .swift
      # alone is a real check. spectacle-2 and yahoo-keykey-2 use abstract keys and must list
      # their Localizable.strings too.
      whats_new_path: App/Sources/ClipMenu/WhatsNewConfig.swift
      # Moving the appcast off the marketing site. DONE as of v2.21.0 — the mirror is retired and
      # ClipMenu 2's update feed now lives only in this repository.
      #
      # MAC-APP-RELEASE-LIFECYCLE.md: "Sparkle appcasts are update infrastructure, not marketing
      # content. Each app should host its production appcast in its own repository so an outage,
      # permission problem, or rejected change in the marketing-site repository cannot interfere
      # with update delivery." spectacle-2 and dragon-sample-app migrated first; ice-2 retired its
      # mirror at v2.15.0 and yahoo-keykey-2 at v2.12.0. ClipMenu 2 was the last app still
      # mirroring, so with this release no Dragon app publishes an appcast to the marketing site.
      #
      # The same spec says to migrate "by mirroring the old and new locations until installed
      # versions have moved to the app-owned URL", and that is why this was two releases rather
      # than one. Every ClipMenu installed at the time read its SUFeedURL from the site, so
      # flipping the destination alone would have left all of them silently unable to see updates.
      #
      #   step 1  v2.20.3  published to BOTH, with App/Info.plist still pointing at the site, so
      #                    nothing changed for anyone — but the app-owned feed came into existence
      #                    and was current. Both copies verified byte-identical afterwards.
      #                    (That file was spelled app/Info.plist until §R16 renamed the directory.)
      #   step 2  v2.20.4  SUFeedURL moved to
      #                    https://raw.githubusercontent.com/teddychan/clipmenu-2/main/docs/clipmenu-2/appcast.xml
      #   step 3  v2.21.0  appcast_mirror_repo dropped — this release. ClipMenu 2's production
      #                    feed is now published to this repository only.
      #
      # That trigger was chosen on 2026-08-11, replacing "when no supported version still reads
      # the site" — which read like a rule but named no measurable condition, so it would have
      # stayed "later" indefinitely. The site is GitHub Pages and exposes no per-path traffic, so
      # there is no way to observe when the last reader stops reading. A minor release is instead a
      # real, deliberate event that already opens a PR here, so the removal rides one rather than
      # needing its own; and Sparkle checks daily by default, so anyone who launches ClipMenu even
      # once between 2.20.4 and this release has already moved to the app-owned feed.
      #
      # The mirror was not dropped before this point. Every copy still at 2.20.3 or older reads the
      # site and only the site; the mirror is the whole reason flipping SUFeedURL did not strand
      # them. The accepted cost was the other direction: shipping no minor for a long time would
      # have kept the mirror that long. That is the safe way to be wrong — an unnecessary mirror
      # costs one extra publish per release, while a premature drop silently strands installs that
      # cannot tell the difference between "no update" and "feed gone".
      #
      # This edit is only safe in the same PR that bumps the version to 2.21.0. Merged on its own it
      # would take effect on whatever tag ships next — a 2.20.x patch would then drop the mirror
      # early, which is precisely the stranding the two-step migration existed to prevent.
      #
      # What this means from now on: www.dragonapp.com/clipmenu-2/appcast.xml stops being updated.
      # The last version it ever offers is the final 2.20.x release. It is deliberately left in
      # place rather than deleted — a stale feed offers an old version to anything still reading
      # it, which is recoverable; a 404 is not.
      #
      # Publishing to this repo uses the built-in GITHUB_TOKEN (contents: write is granted above),
      # so the release no longer depends on PUBLIC_RELEASE_TOKEN reaching the marketing-site repo
      # at all — that token is still inherited, but now only the Homebrew cask bump uses it.
      #
      # No GitHub Pages setup required: the app-owned URL is served by raw.githubusercontent.com,
      # exactly as spectacle-2's has been since it migrated.
      appcast_repo: teddychan/clipmenu-2-macos
      build_kind: swiftpm
      app_slug: clipmenu-2
      release_title_prefix: ''            # title == tag
      bot_name: ClipMenu Release Bot
      # DragonKit CONFORMANCE §R16 puts the bundle inputs — Info.plist, AppIcon.icns and
      # the entitlements — in App/ at the repo root. This package's root IS that directory
      # (as yahoo-keykey-2's is), so the assembly reads them from the working directory and
      # swiftpm_bundle_inputs_directory stays unset. spectacle-2 and dragon-sample-app keep
      # Package.swift at the repo root instead, so they pass it.
      swiftpm_working_directory: App
      swiftpm_sparkle: true
      # ClipMenu targets the macOS 26 SDK, so build on the macos-26 hosted image.
      swiftpm_runner: macos-26
      # Sign the free direct/Homebrew build with iCloud: embeds the Developer ID iCloud
      # provisioning profile (PROVISIONING_PROFILE_BASE64) + these entitlements. Falls
      # back to local-only if the profile secret is absent.
      swiftpm_icloud_entitlements_path: App/ClipMenu.entitlements
      # Fail the release (before notarization) if the tag doesn't match
      # App/Info.plist's CFBundleShortVersionString, so a forgotten version bump
      # can't ship a zip named for the tag containing an app reporting the old
      # version — and can't put a stale version in the Sparkle appcast.
      assert_tag_matches_plist: true
      zip_name_template: 'ClipMenu-{MAJOR}-{TAG}.zip'
      zip_keep_parent: true
      generate_appcast_glob: swiftpm
